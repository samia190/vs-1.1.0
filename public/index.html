<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS 1.1.0 - Full Stack Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>VS 1.1.0 Application</h1>
            <p>Backend and Frontend Connected Successfully</p>
        </header>

        <div class="status-section">
            <h2>Connection Status</h2>
            <div id="status" class="status-badge">Checking...</div>
            <button onclick="checkHealth()" class="btn">Check Backend Health</button>
        </div>

        <div class="content-section">
            <h2>Content from API</h2>
            <button onclick="loadContent()" class="btn btn-primary">Load Content</button>
            <div id="content-container" class="content-list"></div>
        </div>

        <div class="error-section" id="error-section" style="display: none;">
            <h3>Error</h3>
            <p id="error-message"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
